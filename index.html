<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>img2svg — Image to SVG Converter</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/style.css">
  <script>
    // Prevent FOUC: apply saved theme before first paint
    (function() {
      var t = localStorage.getItem('img2svg-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 28 28" width="28" height="28" fill="none">
          <rect width="28" height="28" rx="7" fill="var(--accent)"/>
          <path d="M5 19l5-7 3.5 4.5 3.5-9 5.5 11.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>img2svg</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme">
        <svg class="theme-icon-light" viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
          <path d="M10 3a1 1 0 011 1v1a1 1 0 01-2 0V4a1 1 0 011-1zm4.22 1.78a1 1 0 010 1.41l-.71.71a1 1 0 11-1.41-1.41l.71-.71a1 1 0 011.41 0zM17 10a1 1 0 01-1 1h-1a1 1 0 010-2h1a1 1 0 011 1zm-2.78 4.22a1 1 0 01-1.41 0l-.71-.71a1 1 0 011.41-1.41l.71.71a1 1 0 010 1.41zM10 17a1 1 0 01-1-1v-1a1 1 0 012 0v1a1 1 0 01-1 1zm-4.22-1.78a1 1 0 010-1.41l.71-.71a1 1 0 011.41 1.41l-.71.71a1 1 0 01-1.41 0zM3 10a1 1 0 011-1h1a1 1 0 010 2H4a1 1 0 01-1-1zm2.78-4.22a1 1 0 011.41 0l.71.71A1 1 0 016.49 7.9l-.71-.71a1 1 0 010-1.41zM10 7a3 3 0 100 6 3 3 0 000-6z"/>
        </svg>
        <svg class="theme-icon-dark" viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.003 8.003 0 1010.586 10.586z"/>
        </svg>
      </button>
    </div>
    <p class="subtitle">Convert raster images to clean SVG vectors — entirely in your browser</p>
  </header>

  <main>
    <div class="panels">
      <section id="input-panel" class="panel">
        <div class="panel-header">
          <h2>Original</h2>
        </div>
        <div id="drop-zone">
          <input type="file" id="file-input" accept="image/*" hidden>
          <div class="drop-zone-content">
            <div class="drop-icon-wrap">
              <svg class="drop-icon" viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="6" y="6" width="36" height="36" rx="6"/>
                <circle cx="18" cy="20" r="3.5"/>
                <path d="M6 34l10-10 8 8 6-6 12 12" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="drop-text">Drop an image here or <span class="link">browse</span></p>
            <p class="drop-hint">PNG, JPG, GIF, WebP supported</p>
          </div>
        </div>
        <div id="original-preview" class="preview-area" hidden></div>
      </section>

      <section id="output-panel" class="panel">
        <div class="panel-header">
          <h2>SVG Output</h2>
          <div class="panel-actions">
            <span id="status-text"></span>
            <button id="download-btn" class="btn btn-primary btn-small" disabled title="Download SVG">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M8 2v9m0 0l-3.5-3.5M8 11l3.5-3.5M2 14h12" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="btn-label">Download</span>
            </button>
            <button id="copy-btn" class="btn btn-secondary btn-small" disabled title="Copy SVG to clipboard">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5" y="5" width="9" height="9" rx="1.5"/>
                <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/>
              </svg>
              <span class="btn-label">Copy</span>
            </button>
          </div>
        </div>
        <div id="svg-preview" class="preview-area">
          <div class="placeholder">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35">
              <path d="M8 8h32v32H8z" stroke-dasharray="4 3" rx="4"/>
              <path d="M18 24h12M24 18v12" stroke-linecap="round"/>
            </svg>
            <span>SVG output appears here</span>
          </div>
        </div>
      </section>
    </div>

    <aside id="controls-panel">
      <div class="controls-header">
        <h2>Tracing Options</h2>
        <div class="controls-actions">
          <label class="live-toggle" title="Auto-retrace when settings change">
            <span class="live-label">Live</span>
            <input type="checkbox" id="live-toggle" checked>
          </label>
          <button id="reset-btn" class="btn btn-ghost btn-small" title="Reset to defaults">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M2 8a6 6 0 1111.5-2.5" stroke-linecap="round"/>
              <path d="M13 2v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reset
          </button>
        </div>
      </div>

      <div class="tab-bar" role="tablist">
        <button class="tab active" role="tab" data-tab="bw" aria-selected="true">Black &amp; White</button>
        <button class="tab" role="tab" data-tab="color" aria-selected="false">Color</button>
      </div>

      <div id="tab-content"></div>

      <button id="trace-btn" class="btn btn-primary trace-btn" hidden>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 2l10 6-10 6V2z" fill="currentColor" stroke="none"/>
        </svg>
        Trace
      </button>

      <details id="advanced-section">
        <summary>Advanced</summary>
        <div id="advanced-controls"></div>
      </details>
    </aside>
  </main>

  <div id="size-warning" class="toast" hidden>
    <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
      <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 3a1 1 0 011 1v4a1 1 0 01-2 0V6a1 1 0 011-1zm0 8a1 1 0 100 2 1 1 0 000-2z"/>
    </svg>
    <span>Image downscaled for performance. Original: <strong id="original-size"></strong></span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
